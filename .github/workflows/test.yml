# Runs the type check and every test (npm test), split in three jobs that
# run at the same time, so each finishes well inside its time limit:
# - checks: the type check, then every test that does not use a browser
#   (money, server, web, repo), with SKIP_BROWSER_TESTS=1;
# - chromium: the browser tests in Chromium only (BROWSER_ENGINE=chromium);
# - webkit: the browser tests in WebKit only (BROWSER_ENGINE=webkit).
# Together they are exactly npm test: test/ci-workflow.test.ts checks that no
# test is left out. (One job took 38 min 46 s on PR #16, against 45.)
#
# On every pull request: Linux only. Windows minutes count double, so
# Windows runs only when started by hand (Actions, Tests, Run workflow,
# pick the branch), for a phase's finish line. The manual run asks which
# systems: Windows (the default), Linux, or both.
name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      systems:
        description: Which systems to run on
        type: choice
        options:
          - windows
          - linux
          - both
        default: windows

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going. A run
# started by hand is never replaced by a push, nor a push's run by it.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.part }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || inputs.systems == 'both' && '["ubuntu-latest","windows-latest"]' || inputs.systems == 'linux' && '["ubuntu-latest"]' || '["windows-latest"]') }}
        part: [checks, chromium, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Pinned to exact commits; the comment says which release each one is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The type check, then everything but the browser tests.
      - name: Type check
        if: matrix.part == 'checks'
        run: npm run typecheck
      - name: Every test without a browser
        if: matrix.part == 'checks'
        env:
          SKIP_BROWSER_TESTS: '1'
        run: npx vitest run

      # The browser tests use the screens in Chromium and in WebKit (iPhone
      # Safari's engine): Playwright's own copies, at the version in
      # package-lock.json. Each browser job downloads only its own browser.
      # The browsers are kept between runs, one copy per system, browser and
      # Playwright version; a new version downloads them again.
      - name: Playwright version
        if: matrix.part != 'checks'
        id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Keep the Playwright browser between runs
        if: matrix.part != 'checks'
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ matrix.part }}-${{ steps.playwright.outputs.version }}
      - name: Download the browser
        if: matrix.part != 'checks' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.part }}
      # The system libraries the browser needs are not in the kept copy, so
      # Linux installs them every time (Windows needs none).
      - name: Install the browser's system libraries
        if: matrix.part != 'checks' && steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.part }}
      - name: The browser tests in ${{ matrix.part }}
        if: matrix.part != 'checks'
        env:
          BROWSER_ENGINE: ${{ matrix.part }}
        run: npx vitest run --project web-browser
