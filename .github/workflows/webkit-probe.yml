# TEMPORARY: finds out why WebKit on Linux sometimes leaves Home loading
# (scripts/webkit-probe.mjs). Removed once it has answered.
name: WebKit probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: node scripts/demo.mjs --build-only
      - run: node scripts/webkit-probe.mjs 60
      # The real browser tests, three times over, to see how often they stall.
      - run: |
          for run in 1 2 3; do
            npx vitest run --project web-browser --reporter=dot || echo "run $run FAILED"
          done
