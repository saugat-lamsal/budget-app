# TEMPORARY: checks the fix for Home staying in loading on WebKit on Linux
# by running the browser tests five times over. Removed once it has
# answered.
name: WebKit probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          failed=0
          for run in 1 2 3 4 5; do
            npx vitest run --project web-browser --reporter=dot || { echo "run $run FAILED"; failed=$((failed + 1)); }
          done
          echo "$failed of 5 runs failed"
          test "$failed" -eq 0
