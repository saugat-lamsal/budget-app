<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payday, Linear style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#020203}
a{color:#8F98E8}a:hover{color:#B4BBF2}
.lp{font-family:'Geist',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.lp button{font-family:inherit;cursor:pointer}
.lp button:focus-visible{outline:2px solid rgba(94,106,210,0.7);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#8A8F98}
.card{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.065),rgba(255,255,255,0.02));box-shadow:0 0 0 1px rgba(255,255,255,0.06),0 2px 20px rgba(0,0,0,0.4),0 0 40px rgba(0,0,0,0.2),inset 0 1px 0 0 rgba(255,255,255,0.07)}
.edge{position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent)}
.gtext{background:linear-gradient(180deg,#FFFFFF 0%,rgba(255,255,255,0.95) 45%,rgba(255,255,255,0.62) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.shimmer{background:linear-gradient(90deg,#4CC3A5,#D9FFF4,#4CC3A5);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.blob{position:absolute;border-radius:50%;pointer-events:none;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(1deg)}}
.up{animation:up 600ms cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.scalein{animation:scalein 600ms cubic-bezier(.16,1,.3,1) both}
@keyframes scalein{from{opacity:0;transform:scale(.95)}}
.seg{transform-origin:left;animation:seg 800ms cubic-bezier(.16,1,.3,1) both}
@keyframes seg{from{transform:scaleX(0)}}
.split{transition:gap 400ms cubic-bezier(.16,1,.3,1)}
.lightup{animation:lightup 1400ms cubic-bezier(.16,1,.3,1) both}
@keyframes lightup{0%{opacity:0}25%{opacity:1}100%{opacity:.55}}
.sweep{animation:sweep 1200ms cubic-bezier(.16,1,.3,1) both}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.mote{animation:mote 2200ms cubic-bezier(.16,1,.3,1) both}
@keyframes mote{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0}}
.cta{position:relative;overflow:hidden;transition:transform 200ms cubic-bezier(.16,1,.3,1)}
.cta:active{transform:scale(.98)}
.cta::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,0.25) 50%,transparent 70%);transform:translateX(-120%);animation:csweep 3.6s cubic-bezier(.16,1,.3,1) infinite;animation-delay:3.4s}
@keyframes csweep{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.lp *,.lp *::after{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="lp" style="width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 44px; color: #EDEDEF; background: radial-gradient(ellipse at top, #0c0c13 0%, #050506 50%, #020203 100%)">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
  <div class="blob" style="left: -60px; top: -280px; width: 510px; height: 560px; background: rgba(94,106,210,0.26); filter: blur(90px)"></div>
  <div class="blob" style="left: -40px; top: 360px; width: 470px; height: 380px; background: rgba(76,195,165,0.14); filter: blur(90px); animation-delay: -4s"></div>
  <div style="position: absolute; inset: 0; opacity: 0.025; background-image: linear-gradient(rgba(255,255,255,1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px); background-size: 64px 64px"></div>
  <svg width="390" height="844" style="position: absolute; inset: 0; opacity: 0.05; mix-blend-mode: overlay"><filter id="nzp"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="390" height="844" filter="url(#nzp)"></rect></svg>
</div>

<sc-if value="{{show}}" hint-placeholder-val="{{true}}">
<div style="position: relative; display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 58px 20px 30px; box-sizing: border-box">
  <div class="up" style="display: flex; align-items: flex-end; justify-content: space-between">
    <div>
      <div class="mono">Fri · Oct 31</div>
      <div class="gtext" style="font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin-top: 2px">Payday</div>
    </div>
    <button onClick="{{replay}}" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); color: #8A8F98; font-size: 12px; font-weight: 500">Replay</button>
  </div>

  <div class="card up" style="padding: 18px; animation-delay: 120ms">
    <div class="edge"></div>
    <div class="mono">Paycheck posted</div>
    <div class="gtext" style="font-size: 46px; font-weight: 600; letter-spacing: -0.045em; margin-top: 6px; line-height: 1.05">{{payText}}</div>
    <div class="up" style="display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); animation-delay: 1000ms">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #D58DB4"></span>
      <span style="flex: 1; font-size: 13px; font-weight: 500">Mom reserve first</span>
      <span style="font-size: 13px; font-weight: 600; color: #D58DB4">−$150.00</span>
    </div>
  </div>

  <div class="up" style="animation-delay: 1500ms; padding: 4px 2px">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px"><span class="mono">Split · 50 / 30 / 20</span><span style="font-size: 12px; color: #8A8F98">{{splitText}}</span></div>
    <div class="split" style="display: flex; height: 6px; {{splitGap}}">
      <div class="seg" style="width: 50%; border-radius: 3px; background: #4CC3A5; box-shadow: 0 0 12px rgba(76,195,165,0.7); animation-delay: 1650ms"></div>
      <div class="seg" style="width: 30%; border-radius: 3px; background: {{accent}}; box-shadow: 0 0 12px {{accentGlow}}; animation-delay: 1780ms"></div>
      <div class="seg" style="width: 20%; border-radius: 3px; background: rgba(237,237,239,0.55); animation-delay: 1900ms"></div>
    </div>
  </div>

  <div style="position: relative">
    <div class="card scalein" style="padding: 18px; animation-delay: 2150ms; background: linear-gradient(180deg, rgba(76,195,165,0.12), rgba(76,195,165,0.03))">
      <div class="lightup" style="position: absolute; inset: 0; border-radius: 16px; box-shadow: 0 0 0 1px rgba(76,195,165,0.45), 0 0 60px rgba(76,195,165,0.3), inset 0 1px 0 0 rgba(255,255,255,0.15); pointer-events: none; animation-delay: 2600ms"></div>
      <div class="sweep" style="position: absolute; top: 0; bottom: 0; width: 60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.08), transparent); pointer-events: none; animation-delay: 2700ms"></div>
      <div style="display: flex; align-items: center; gap: 6px; color: #4CC3A5"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg><span class="mono" style="color: #4CC3A5">To savings</span></div>
      <div class="shimmer" style="font-size: 40px; font-weight: 600; letter-spacing: -0.04em; margin-top: 6px">{{savText}}</div>
      <div style="font-size: 12px; color: #9BCFC1; margin-top: 2px">Savings will be $10,010 · your best payday yet</div>
    </div>
    <div style="position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none">
      <sc-for list="{{motes}}" as="m" hint-placeholder-count="14"><span class="mote" style="position: absolute; {{m.style}}"></span></sc-for>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div class="card up" style="padding: 14px; animation-delay: 2350ms">
      <div class="edge"></div>
      <div style="display: flex; align-items: center; gap: 7px"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}; box-shadow: 0 0 8px {{accent}}"></span><span class="mono">Needs</span></div>
      <div class="gtext" style="font-size: 22px; font-weight: 600; margin-top: 8px; letter-spacing: -0.03em">{{needsText}}</div>
    </div>
    <div class="card up" style="padding: 14px; animation-delay: 2450ms">
      <div class="edge"></div>
      <div style="display: flex; align-items: center; gap: 7px"><span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(237,237,239,0.55)"></span><span class="mono">Wants</span></div>
      <div class="gtext" style="font-size: 22px; font-weight: 600; margin-top: 8px; letter-spacing: -0.03em">{{wantsText}}</div>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div class="up" style="display: flex; flex-direction: column; gap: 10px; animation-delay: 2900ms">
    <button class="cta" style="height: 50px; border-radius: 10px; border: 0; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{accent}}; box-shadow: 0 0 0 1px {{accentRing}}, 0 4px 18px {{accentGlow}}, inset 0 1px 0 0 rgba(255,255,255,0.2)">
      Move $1,070 to savings
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
    </button>
    <div class="mono" style="text-align: center; letter-spacing: 0.06em; text-transform: none; font-size: 11px; color: #5F6470">Copies the amount, opens Bank of America. The app never moves money.</div>
  </div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E6AD2","options":["#5E6AD2","#7A4FD1","#2F7FC1","#C2416B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true, t: 0 };
  }
  componentDidMount() { this.run(); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); clearTimeout(this.tm); }
  run() {
    cancelAnimationFrame(this.raf);
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min(3600, now - t0);
      this.setState({ t });
      if (t < 3600) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  renderVals() {
    const t = this.state.t;
    const accent = this.props.accent || '#5E6AD2';
    const hex = accent.replace('#', '');
    const rgb = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const rgba = (a) => 'rgba(' + rgb.join(',') + ',' + a + ')';
    const win = (a, b) => { const k = Math.max(0, Math.min(1, (t - a) / (b - a))); return k === 1 ? 1 : 1 - Math.pow(2, -10 * k); };
    const money = (c) => '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const motes = [];
    for (let i = 0; i < 14; i++) {
      const x = Math.round(((i * 53) % 300) - 150);
      const y = -Math.round(60 + ((i * 37) % 90));
      const size = 2 + (i % 3);
      motes.push({ style: 'left: ' + x + 'px; top: 10px; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: ' + (i % 4 === 0 ? '#EDEDEF' : '#4CC3A5') + '; box-shadow: 0 0 8px #4CC3A5; transform: translate(' + Math.round(x * 0.15) + 'px,' + y + 'px); animation-delay: ' + (2650 + (i % 6) * 70) + 'ms' });
    }
    return {
      accent, accentGlow: rgba(0.45), accentRing: rgba(0.5),
      show: this.state.show,
      payText: money(Math.round(229000 * win(150, 1100))),
      splitText: money(Math.round(214000 * win(1500, 2100))),
      splitGap: 'gap: ' + (t > 1600 ? 4 : 0) + 'px',
      savText: money(Math.round(107000 * win(2200, 3200))),
      needsText: money(Math.round(64200 * win(2350, 3300))),
      wantsText: money(Math.round(42800 * win(2450, 3400))),
      motes,
      replay: () => {
        this.setState({ show: false, t: 0 });
        clearTimeout(this.tm);
        this.tm = setTimeout(() => { this.setState({ show: true }); this.run(); }, 40);
      }
    };
  }
}
</script>
</body>
</html>
